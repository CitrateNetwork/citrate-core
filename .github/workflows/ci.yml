# created: 2026-07-11 | branch: feat/core-s0-scaffold
# author: Claude Fable 5 (CORE-S0 scaffold agent), directed by @SaulBuilds
# status: active
#
# Honest CI: only steps that pass on this scaffold. Native Tauri bundling,
# e2e, and release signing arrive in later sprints (CORE-S7).
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    # citrate-core depends on private federation crates (citrate-wallet-core, from
    # the private citrate-chain repo). Cargo's git fetch needs read credentials the
    # default GITHUB_TOKEN does not carry cross-repo. Provide a read-only token as
    # secret CITRATE_CHAIN_READ_TOKEN (fine-grained PAT, Contents:read on
    # citrate-chain; or a deploy key). Fetch via the system git so the insteadOf
    # credential is honored.
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # secrets can't be referenced in a step `if:`, so map it into env first.
      CHAIN_TOKEN: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate to private federation repos (citrate-chain)
        if: ${{ env.CHAIN_TOKEN != '' }}
        run: |
          git config --global \
            url."https://x-access-token:${CHAIN_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: audit
        run: |
          cargo install cargo-audit --locked
          # RUSTSEC-2025-0055 (tracing-subscriber 0.2 ANSI-escape log poisoning):
          # not fixable from this lockfile — pulled transitively via the private
          # citrate-commd -> ark-relations 0.4 dep, which pins tracing 0.2; the fix
          # is a breaking 0.3.x that ark-relations must adopt upstream. Low-severity
          # (log-injection, reachable only through that ZK dep's logging). Revisit
          # when ark-relations bumps tracing. All other advisories are cleared
          # (rustls bumped to 0.23.45) or non-failing unmaintained warnings.
          # RUSTSEC-2026-0367/0368/0369 (zip < 9: set-id bits kept, symlink targets outside the
          # destination, permissions applied through symlinks; all in ZipArchive::extract). Our
          # own zip user, citrate-components, is on zip 9. The only zip < 9 left is
          # tauri-plugin-updater's, which has no release on zip 9 yet (2.14.0 and 3.0.0-alpha.3
          # still require ^4). That dependency is Windows-only, and the plugin unzips only an
          # update payload whose minisign signature it has already checked against the pinned
          # updater key (download() verifies before any install path sees the bytes). The guard
          # below fails if anything else ever pulls a zip older than 9. Remove these ignores
          # when the updater moves to zip >= 9.
          # RUSTSEC-2026-0387 (crypto-bigint < 0.7.6: operations meant to be constant-time could
          # branch, depending on compiler and target). EXPIRES 2026-11-09. Fixed only in 0.7.6.
          # crypto-bigint 0.5.5 comes in only through elliptic-curve 0.13 (k256 / p256 0.13, used
          # by kit, src-tauri, and citrate-wallet-core at the chain pin). No 0.13.x release takes
          # crypto-bigint 0.7, so the lockfile cannot move it; the fix is the k256 0.14 line, which
          # needs bip32 0.6 here and the chain's wallet-core to move first. The items the advisory
          # names (UintRef equality, BoxedMontyForm::invert, the 0.7 borrowing_sub) are not in
          # 0.5.x; the 0.13 curve crates call only 0.5.x's fixed-width add/sub/compare/select.
          # The guard below fails if another crate pulls a crypto-bigint < 0.7.6, if none is left
          # (stale ignore), or after the expiry date.
          python3 scripts/check-crypto-bigint-users.py --self-test
          python3 scripts/check-crypto-bigint-users.py
          cargo audit --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0387

  node:
    name: node (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PBA-L7b-005 tripwire: release.yml may only stage runtime-deps assets that pass the
      # committed sha256 manifest, verified before anything is staged or signed.
      - name: release pin tripwire
        run: scripts/ci/check-release-pins.sh
      # Release component pins: release/components.json, the build scripts, the bundle overlays,
      # src-tauri/runtime-deps.sha256, release.yml (incl. its dry-run guards) and the app's model
      # pin must agree; a component script that builds outside the pinned engine fails here.
      - name: release component pins
        run: node scripts/component-pins.mjs check
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test
      - name: build
        run: npm run build
