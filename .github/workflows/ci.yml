# created: 2026-07-11 | branch: feat/core-s0-scaffold
# author: Claude Fable 5 (CORE-S0 scaffold agent), directed by @SaulBuilds
# status: active
#
# Honest CI: only steps that pass on this scaffold. Native Tauri bundling,
# e2e, and release signing arrive in later sprints (CORE-S7).
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # Merge queue: every PR queued for main is re-checked on its merge-group commit (main plus the
  # PRs ahead of it). merge-gate's `ci` summary waits for these jobs there, so they must run.
  merge_group:
    types: [checks_requested]
  # Weekly on main, so the dated audit ignores (RUSTSEC-2026-0387 expires 2027-01-31) fail CI on
  # the day they lapse even when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  rust:
    name: rust (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    # citrate-core depends on private federation crates (citrate-wallet-core, from
    # the private citrate-chain repo). Cargo's git fetch needs read credentials the
    # default GITHUB_TOKEN does not carry cross-repo. Provide a read-only token as
    # secret CITRATE_CHAIN_READ_TOKEN (fine-grained PAT, Contents:read on
    # citrate-chain; or a deploy key). Fetch via the system git so the insteadOf
    # credential is honored.
    #
    # The token is NOT a job env and is never written to a git config file: a job env reaches
    # every step, the PR's own build scripts and tests included. It is mapped into the one step
    # that fetches the crates (`cargo fetch` runs no build script and no test), as an in-process
    # git config (GIT_CONFIG_*), the way LQ-WP01's lq-ratchet.yml does. Everything after that
    # step builds offline, and a check refuses to go on if a credential is left on disk.
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Pinned (2026-11-12): floating `stable` moved to 1.100, whose new clippy lint and build-dir
      # layout broke every PR at once. Bump this version only in a reviewed PR that runs fmt,
      # clippy and the tests on the new toolchain.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      # For scripts/ci/lq/ratchet.mjs cargo-counts after the tests (LQ-WP02).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch the private crates (cargo fetch --locked; the only step with the token)
        env:
          CHAIN_TOKEN: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CHAIN_TOKEN}" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${CHAIN_TOKEN}@github.com/.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/"
          fi
          cargo fetch --locked > /dev/null 2>&1 || { echo "cargo fetch --locked failed (output withheld: it can carry the credential)" >&2; exit 1; }
      - name: No credential left on disk for the PR's build scripts and tests
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if grep -rIlq 'x-access-token' "$HOME/.gitconfig" "$cargo_home/git" 2>/dev/null; then
            echo "a git credential is on disk after cargo fetch; refusing to run PR code next to it" >&2
            exit 1
          fi
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      # LQ-WP02: --no-fail-fast so every crate reports. The raw log stays in this job's log; only
      # the validated counts (scripts/ci/lq/ratchet.mjs cargo-counts, from the log plus cargo's own
      # exit status) leave the job, for lq / ratchet. A red, partial or truncated run writes no
      # counts file, and this step fails with cargo's exit status.
      - name: test
        shell: bash
        run: |
          # GitHub's `bash -e` would stop at a failing cargo: turn -e off so its status is kept.
          set +e -uo pipefail
          cargo test --workspace --locked --offline --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          code=${PIPESTATUS[0]}
          node scripts/ci/lq/ratchet.mjs cargo-counts --cargo-log "$RUNNER_TEMP/cargo-test.log" \
            --cargo-exit "$code" --out "$RUNNER_TEMP/cargo-counts.json" || exit 1
          exit "$code"
      - name: Upload the validated cargo counts for lq / ratchet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lq-cargo-counts
          path: ${{ runner.temp }}/cargo-counts.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: audit
        run: |
          cargo install cargo-audit --locked
          # RUSTSEC-2025-0055 (tracing-subscriber 0.2 ANSI-escape log poisoning):
          # not fixable from this lockfile — pulled transitively via the private
          # citrate-commd -> ark-relations 0.4 dep, which pins tracing 0.2; the fix
          # is a breaking 0.3.x that ark-relations must adopt upstream. Low-severity
          # (log-injection, reachable only through that ZK dep's logging). Revisit
          # when ark-relations bumps tracing. All other advisories are cleared
          # (rustls bumped to 0.23.45) or non-failing unmaintained warnings.
          # RUSTSEC-2026-0367/0368/0369 (zip < 9: set-id bits kept, symlink targets outside the
          # destination, permissions applied through symlinks; all in ZipArchive::extract) and
          # RUSTSEC-2026-0429 (zip < 9: ZipArchive::extract aborts the process on a symlink entry
          # with a large declared size; published 2026-10-22). Our own zip user,
          # citrate-components, is on zip 9. The only zip < 9 left is tauri-plugin-updater
          # 2.10.1's. tauri-plugin-updater 2.14.1 moves to zip ^9 but needs tauri ^2.12 and
          # reqwest 0.13 (we are on tauri 2.11.5), so taking it is a Tauri upgrade of its own.
          # That dependency is Windows-only, and the plugin unzips only an update payload whose
          # minisign signature it has already checked against the pinned updater key
          # (download() verifies before any install path sees the bytes), so a crafted archive
          # cannot reach extract. The guard below fails if anything else ever pulls a zip older
          # than 9.0.5. Remove these ignores with the move to tauri-plugin-updater >= 2.14.1.
          # RUSTSEC-2026-0545 (zip < 9: AES entries returned unauthenticated when data ends early)
          # and RUSTSEC-2026-0548 (zip < 9.0.5: ZipStreamReader names can differ from the central
          # directory), both published 2026-11-17. citrate-components is on the patched zip 9.0.5.
          # The updater's zip 4.6.1 is built without AES (no aes/aes-crypto dependency in
          # Cargo.lock), and it extracts through ZipArchive, not ZipStreamReader, and only after
          # the signature check above. EXPIRES 2027-01-31 (added 2026-11-17, the window of the
          # crypto-bigint ignore below; the guard fails CI after that day). Same guard, which
          # fails if any crate but the updater depends on a zip below 9.0.5 (0548's fix), and the
          # same removal condition. Reachability and cases: the docstring of
          # scripts/check-zip-users.py.
          python3 scripts/check-zip-users.py --self-test
          python3 scripts/check-zip-users.py
          # RUSTSEC-2026-0387 (crypto-bigint < 0.7.6): multiple timing variability issues in
          # operations intended to be constant-time. EXPIRES 2027-01-31 (renewed 2026-11-08 from
          # 2026-11-09, aligned with citrate-chain's identical ignore). elliptic-curve 0.13
          # requires crypto-bigint ^0.5; the fix is in the 0.14 curve line (elliptic-curve 0.14.3,
          # k256 0.14.0), a semver-major move that citrate-wallet-core at the pinned chain rev has
          # not made (it still pulls k256 0.13 and bip32 0.5.3). Re-verification evidence and
          # reachability: the docstring of scripts/check-crypto-bigint-users.py, the guard.
          # Tracking: #607 (the 0.14 curve-line upgrade that removes this ignore).
          python3 scripts/check-crypto-bigint-users.py --self-test
          python3 scripts/check-crypto-bigint-users.py
          cargo audit --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0429 --ignore RUSTSEC-2026-0545 --ignore RUSTSEC-2026-0548 \
            --ignore RUSTSEC-2026-0387

  node:
    name: node (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PBA-L7b-005 tripwire: release.yml may only stage runtime-deps assets that pass the
      # committed sha256 manifest, verified before anything is staged or signed.
      - name: release pin tripwire
        run: scripts/ci/check-release-pins.sh
      # Release component pins: release/components.json, the build scripts, the bundle overlays,
      # src-tauri/runtime-deps.sha256, release.yml (incl. its dry-run guards) and the app's model
      # pin must agree; a component script that builds outside the pinned engine fails here.
      - name: release component pins
        run: node scripts/component-pins.mjs check
      # K6: every network profile is well formed, an unset value always has a reason, and the
      # active one is release-ready (the same check release.yml runs as the G0 gate).
      - name: network profile
        run: scripts/check-network-profile.sh --release
      # CORE-N1: the network cut file (release/network-cut.json) is well formed and every value
      # still pending names what sets it. Its --release form runs inside the check above once
      # its profile is the active one.
      - name: network cut
        run: python3 -I scripts/network-cut.py check
      - name: typecheck
        run: npm run typecheck
      # LQ-WP02: the vitest json report is the runner's own count for lq / ratchet.
      - name: test
        run: npm run test -- --reporter=default --reporter=json --outputFile.json=vitest.json
      - name: keep the vitest report for lq / ratchet
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lq-vitest-json
          path: vitest.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: build
        run: npm run build

  # LQ-WP02 (0.6.0, lane LQ): the test-count ratchet, check `lq / ratchet` (Rule 2). It runs after
  # rust and node even when they fail, because a skipped required check counts as passed; it then
  # fails closed on their results and on the missing or red runner output. The write permissions
  # are for its `record` job only, which runs on a push to main; the `ratchet` job drops to read.
  lq:
    needs: [rust, node]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/lq-compare.yml
    with:
      rust_result: ${{ needs.rust.result }}
      node_result: ${{ needs.node.result }}
