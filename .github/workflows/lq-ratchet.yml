# created: 2026-11-26 | branch: feat/v60-lq-wp01-baseline
# author: Larry Klosowski (LQ lane, 0.6.0)
# status: active
name: lq ratchet

# LQ-WP01: measure the coverage baseline from the test runners' own output on ubuntu-latest and
# publish it as the `ratchet-json` artifact (.agentile/coverage/ratchet.json, schema v1). The
# numbers committed in .agentile/coverage/ come from this artifact, never from a Mac build or a
# grep. A run with any failed test writes no ratchet.json (scripts/ci/lq/ratchet.mjs refuses it).
#
# LQ-WP02 adds the compare step (`lq / ratchet`, required on main and in the merge queue). Until
# then this workflow only measures, on the paths that change what it measures with.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lq-ratchet.yml"
      - "scripts/ci/lq/**"
      - ".agentile/coverage/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lq-ratchet.yml"
      - "scripts/ci/lq/**"
      - ".agentile/coverage/**"

permissions:
  contents: read

concurrency:
  group: lq-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: lq measure (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same toolchain, deps and private-crate access as ci.yml's rust job, so the count is the
    # count of the job that gates merges.
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CHAIN_TOKEN: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The PR head itself, not the synthetic merge commit, so ratchet.json's rev is a real
          # commit on the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate to private federation repos (citrate-chain)
        if: ${{ env.CHAIN_TOKEN != '' }}
        run: |
          git config --global \
            url."https://x-access-token:${CHAIN_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.99.1"
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The test log becomes an artifact, and GitHub masks secrets only in the live log, not in
      # artifacts. So the private crates are fetched first (log not kept), the credential is
      # dropped, and the tests run offline: no git URL carrying the token can reach the log.
      - name: cargo fetch --locked (private crates; log not kept)
        run: cargo fetch --locked
      - name: Drop the private-repo credential before the tests
        if: ${{ env.CHAIN_TOKEN != '' }}
        run: git config --global --unset-all url."https://x-access-token:${CHAIN_TOKEN}@github.com/".insteadOf
      - name: cargo test --workspace --locked --no-fail-fast
        run: |
          set -o pipefail
          cargo test --workspace --locked --offline --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      - name: Refuse to upload a log that carries a credential
        if: ${{ !cancelled() }}
        run: |
          if grep -q 'x-access-token' "$RUNNER_TEMP/cargo-test.log"; then
            echo "cargo-test.log mentions x-access-token; not uploading it" >&2
            rm -f "$RUNNER_TEMP/cargo-test.log"
            exit 1
          fi
      - name: Upload the cargo test log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-test-log
          path: ${{ runner.temp }}/cargo-test.log
          if-no-files-found: error

  vitest-json:
    name: lq measure (vitest json)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: vitest run --reporter=json
        run: npx vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - name: Upload the vitest json
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-json
          path: ${{ runner.temp }}/vitest.json
          if-no-files-found: error

  measure:
    name: lq measure (ratchet.json)
    needs: [cargo-test, vitest-json]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-test-log
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vitest-json
          path: ${{ runner.temp }}/in
      - name: ratchet.mjs measure
        env:
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/ci/lq/ratchet.mjs measure \
            --cargo-log "$RUNNER_TEMP/in/cargo-test.log" \
            --vitest-json "$RUNNER_TEMP/in/vitest.json" \
            --root . --rev "$REV" --out "$RUNNER_TEMP/ratchet.json"
          {
            echo "### ratchet.json (measured at $REV)"
            echo '```json'
            cat "$RUNNER_TEMP/ratchet.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ratchet.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ratchet-json
          path: ${{ runner.temp }}/ratchet.json
          if-no-files-found: error
