# created: 2026-10-09 | SCL-S1.6 partial core-kit lane
# status: partial — this workflow covers citrate-core-kit supervisor tests only.
# Explicitly excluded: src-tauri/runtime and the remaining SCL-S1.6 platform scope.
name: lifecycle-platforms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kit/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lifecycle-platforms.yml"
  push:
    branches: [main, "release/**"]
    paths:
      - "kit/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lifecycle-platforms.yml"

permissions:
  contents: read

concurrency:
  group: lifecycle-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-kit-supervisor:
    name: core-kit supervisor tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            expected: 3
          - os: macos-14
            expected: 24
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned toolchain action
        with:
          toolchain: 1.98.1

      - name: Run core-kit supervisor tests and verify pass count
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -o pipefail
          cargo test --locked -p citrate-core-kit --lib supervisor::tests -- --nocapture \
            2>&1 | tee supervisor-tests.log
          cargo_status=${PIPESTATUS[0]}
          if [ "$cargo_status" -ne 0 ]; then
            exit "$cargo_status"
          fi
          grep -Fq "test result: ok. ${EXPECTED} passed; 0 failed; 0 ignored" supervisor-tests.log

      # TEMPORARY (fix/windows-child-console-test): repeat the Windows console test to
      # measure its pass rate. Removed before the PR is ready for review.
      - name: "TEMP: repeat windows_child_has_no_console_and_logs_remain_piped 20x"
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 20); do
            if cargo test --locked -p citrate-core-kit --lib -- --exact \
                supervisor::tests::windows_child_has_no_console_and_logs_remain_piped \
                > "stress-$i.log" 2>&1; then
              echo "RUN $i: ok ($(grep -oE 'finished in [0-9.]+s' "stress-$i.log"))"
            else
              failed=$((failed + 1))
              echo "RUN $i: FAILED ($(grep -oE 'finished in [0-9.]+s' "stress-$i.log"))"
              grep -E "panicked|inherited|not captured|left:|right:" "stress-$i.log" || true
            fi
          done
          echo "STRESS: ${failed}/20 failed"
          [ "$failed" -eq 0 ]
