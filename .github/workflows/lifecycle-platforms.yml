# created: 2026-10-09 | SCL-S1.6 partial core-kit lane
# status: partial — this workflow covers citrate-core-kit supervisor tests, plus the K6
# compiled-source check (rustc dep-info) on each shipping target's cfg set.
# Explicitly excluded: src-tauri/runtime and the remaining SCL-S1.6 platform scope.
name: lifecycle-platforms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kit/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lifecycle-platforms.yml"
  push:
    branches: [main, "release/**"]
    paths:
      - "kit/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lifecycle-platforms.yml"

permissions:
  contents: read

concurrency:
  group: lifecycle-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-kit-supervisor:
    name: core-kit supervisor tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            expected: 45
          - os: macos-14
            expected: 69
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned toolchain action
        with:
          toolchain: 1.98.1

      - name: Run core-kit supervisor tests and verify pass count
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -o pipefail
          cargo test --locked -p citrate-core-kit --lib supervisor::tests -- --nocapture \
            2>&1 | tee supervisor-tests.log
          cargo_status=${PIPESTATUS[0]}
          if [ "$cargo_status" -ne 0 ]; then
            exit "$cargo_status"
          fi
          grep -Fq "test result: ok. ${EXPECTED} passed; 0 failed; 0 ignored" supervisor-tests.log

      # K6 (core#363): rustc dep-info lists only what compiled for this target, so code gated on
      # macOS or Windows is checked here, on the target where it compiles (ci.yml covers Linux).
      # The lib build writes the non-test dep-info the check requires.
      - name: Run the K6 compiled-source check on this target and verify pass count
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked -p citrate-core-kit
          cargo test --locked -p citrate-core-kit --lib -- --exact \
            wallet::tests::k6_compiled_sources_stay_in_the_scanned_trees \
            wallet::tests::k6_dep_info_sources_reads_every_listed_file \
            wallet::tests::k6_dep_info_violations_flags_a_probe_the_target_compiled \
            2>&1 | tee k6-dep-info.log
          cargo_status=${PIPESTATUS[0]}
          if [ "$cargo_status" -ne 0 ]; then
            exit "$cargo_status"
          fi
          grep -Fq "test result: ok. 3 passed; 0 failed; 0 ignored" k6-dep-info.log
