# created: 2026-11-27 | branch: feat/v60-lq-wp04-chain-touch-guard
# author: Claude Opus 5.5 (LQ-WP04 worker) for Larry Klosowski
# status: active
#
# lq / chain-touch (LQ-WP04, planset 2026-11-07-v060 lanes/LQ_NON_REGRESSION_GUARD.md): fails a PR
# that changes a chain-adjacent (class C) path unless it is a chain-touch PR with evidence, an
# agreement run and, for a rules delta, the consensus review. Policy and map:
# scripts/ci/lq/chain-touch.mjs and release/chain-touch.json.
#
# Untrusted input: PR metadata (branch, labels, paths) is read by the script from the event file
# and the read-only API, never expanded into a shell. No privileged base-branch trigger, no
# secrets, no write permission. The script that runs is the base branch tip's copy, so a PR cannot
# edit its own guard; it reads the map from the tip too, and takes the merge-base for the diff.
#
# The enforcement job runs no code from the PR head: the head's --self-test runs in its own job on
# its own runner, with no token, so head code cannot poison $GITHUB_PATH, $GITHUB_ENV or the
# checkout's .git before the base copy judges the change. The enforcement job does not `needs` the
# self-test (a required job skipped by a failed dependency reads as passing).
#
# Concurrency: pull_request and pull_request_review runs of one PR share a group without
# cancel-in-progress, so a review submitted mid-run queues behind the running check instead of
# cancelling it (a newer queued run still replaces an older queued one).
name: lq-chain-touch

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: lq-chain-touch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  self-test:
    name: lq / chain-touch self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Self-test (matcher, lock closure, map)
        run: node scripts/ci/lq/chain-touch.mjs --self-test

  chain-touch:
    name: lq / chain-touch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the change
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The base branch tip judges the change (the group's parent in the merge queue). The script
          # takes the merge-base of BASE and HEAD for the diff itself.
          if [ "$EVENT" = merge_group ]; then
            BASE=$(git rev-parse HEAD^1)
          else
            BASE="$PR_BASE"
          fi
          # The base tip's script judges the change; only the PR that introduces it runs its own.
          if git cat-file -e "$BASE:scripts/ci/lq/chain-touch.mjs" 2>/dev/null; then
            git show "$BASE:scripts/ci/lq/chain-touch.mjs" > "$RUNNER_TEMP/chain-touch.mjs"
          else
            echo "chain-touch.mjs is new in this change; running the head copy"
            cp scripts/ci/lq/chain-touch.mjs "$RUNNER_TEMP/chain-touch.mjs"
          fi
          node "$RUNNER_TEMP/chain-touch.mjs" check --from-event --base "$BASE" --root "$GITHUB_WORKSPACE"
