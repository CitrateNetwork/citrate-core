# created: 2026-11-28 | branch: feat/v60-lq-wp12-regression-suite
# author: Larry Klosowski (LQ lane, LQ-WP12; Claude Opus 5.5)
# status: active
#
# lq / regression-suite (LQ-WP12, planset 2026-11-07-v060 lanes/LQ_NON_REGRESSION_GUARD.md): runs
# every registered characterization suite (ci/characterization.json, ci/characterization.d/*.json
# and the surface map .agentile/coverage/characterization.json) on every PR and merge group, and
# refuses a product-lane PR that changes a surface no merge-base suite characterizes. Rules and
# exit codes: scripts/ci/lq/regression-suite.mjs.
#
# No path filter: a required check that does not run on a change cannot judge it. One `cargo test
# --lib` run carries the whole filter set and one vitest run the whole file list, so the group
# commit pays one build (rust-cache, same toolchain as ci.yml).
#
# Untrusted input: the PR's branch name and labels reach the script only through env, as data. PR
# code runs in the two test jobs (it is the code under test); the private-crate token is mapped
# into the one `cargo fetch` step only, as in lq-ratchet.yml. The verdict job runs no PR code: it
# runs the merge base's copy of the script (the head copy only when the script is new), reads the
# head's registry as data and the base's registry from git, and needs no token.
name: lq-regression

on:
  pull_request:
    # labeled/unlabeled: ratchet-adr changes the suite-removal rule.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lq-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    name: lq / regression-suite (cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fetch --locked (private crates; the only step with the token)
        env:
          CHAIN_TOKEN: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CHAIN_TOKEN}" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${CHAIN_TOKEN}@github.com/.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/"
          fi
          cargo fetch --locked > /dev/null 2>&1 || { echo "cargo fetch --locked failed (output withheld: it can carry the credential)" >&2; exit 1; }
      - name: No credential left on disk for the test step
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if grep -rIlq 'x-access-token' "$HOME/.gitconfig" "$cargo_home/git" 2>/dev/null; then
            echo "a git credential is on disk after cargo fetch; refusing to run PR code next to it" >&2
            exit 1
          fi
      - name: cargo test --lib with every registered filter, then the per-test results
        run: |
          set +e -uo pipefail
          node scripts/ci/lq/regression-suite.mjs plan --out "$RUNNER_TEMP/plan.json" || exit 1
          mapfile -t cargo_args < <(node -e 'for (const a of require(process.argv[1]).cargoArgs) console.log(a)' "$RUNNER_TEMP/plan.json")
          cargo "${cargo_args[@]}" 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          code=${PIPESTATUS[0]}
          # Only test names and their status leave the job, never the raw log.
          node scripts/ci/lq/regression-suite.mjs cargo-results --log "$RUNNER_TEMP/cargo-test.log" \
            --exit "$code" --out "$RUNNER_TEMP/cargo-results.json" || exit 1
          exit "$code"
      - name: Upload the cargo results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lq-regression-cargo
          path: ${{ runner.temp }}/cargo-results.json
          if-no-files-found: error
          retention-days: 14

  vitest:
    name: lq / regression-suite (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: vitest run over every registered file
        run: |
          set -euo pipefail
          node scripts/ci/lq/regression-suite.mjs plan --out "$RUNNER_TEMP/plan.json"
          # Registry paths are checked to be plain repo paths (never an option) before they get here.
          mapfile -t files < <(node -e 'for (const f of require(process.argv[1]).vitest.files) console.log(f)' "$RUNNER_TEMP/plan.json")
          npx vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json" "${files[@]}"
      - name: Upload the vitest json
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lq-regression-vitest
          path: ${{ runner.temp }}/vitest.json
          if-no-files-found: error
          retention-days: 14

  # Runs after both test jobs even when they fail (a skipped required check reads as passed), names
  # each suite's verdict, then fails closed on any refusal or any test job that did not succeed.
  verdict:
    name: lq / regression-suite
    needs: [cargo, vitest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: lq-regression-cargo
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: lq-regression-vitest
          path: ${{ runner.temp }}/in
      - name: Check every registered suite, suite removal and characterization first
        env:
          EVENT: ${{ github.event_name }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          # Data only: the script matches the branch against one pattern and labels exactly.
          BRANCH: ${{ github.head_ref }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;  # HEAD is the PR's merge commit
            merge_group) base="$MQ_BASE" ;;
            *) base=$(git rev-parse HEAD~1) ;;
          esac
          if git cat-file -e "$base:scripts/ci/lq/regression-suite.mjs" 2>/dev/null; then
            git show "$base:scripts/ci/lq/regression-suite.mjs" > "$RUNNER_TEMP/regression-suite.mjs"
          else
            echo "regression-suite.mjs is new in this change; running the head copy"
            cp scripts/ci/lq/regression-suite.mjs "$RUNNER_TEMP/regression-suite.mjs"
          fi
          args=(check --root "$GITHUB_WORKSPACE" --base "$base"
                --cargo-results "$RUNNER_TEMP/in/cargo-results.json" --vitest-json "$RUNNER_TEMP/in/vitest.json")
          if [ "$EVENT" = pull_request ]; then
            args+=(--branch "$BRANCH" --labels-json "$LABELS_JSON")
          fi
          node "$RUNNER_TEMP/regression-suite.mjs" "${args[@]}"
      - name: Both test jobs succeeded
        env:
          CARGO_RESULT: ${{ needs.cargo.result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
        run: |
          if [ "$CARGO_RESULT" = success ] && [ "$VITEST_RESULT" = success ]; then exit 0; fi
          echo "::error title=lq / regression-suite::cargo job $CARGO_RESULT, vitest job $VITEST_RESULT"
          exit 1
