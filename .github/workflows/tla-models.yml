name: tla models

# SCL-S13.4: TLC in CI for the sidecar-lifecycle models (core#345, sprint-scl-s1-theory).
# Runs src-tauri/formal/tlc_expect.py over every spec whose configs carry an EXPECT line
# (today SidecarSupervisor and AppExitCoordinator): green configs must pass with every named
# action taken (-coverage), each mutant must fail on its named property, and each reachability
# witness must be violated. The frame lint covers every module in the directory.
#
# TLC is pinned: tla2tools.jar from the tlaplus v1.7.4 release ("TLC2 Version 2.19 of
# 08 August 2024", rev 5a47802), checked by SHA-256 at download and again by tlc_expect.py
# through TLA_JAR_SHA256. A different jar fails the job before any model runs. Bump the
# version and the digest together, and re-run the suite locally first: newer TLC builds word
# temporal verdicts differently (see the classify self-tests).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tla-models.yml"
      - "src-tauri/formal/**"
  push:
    branches: [main, "release/**"]
    paths:
      - ".github/workflows/tla-models.yml"
      - "src-tauri/formal/**"

permissions:
  contents: read

concurrency:
  group: tla-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC (sidecar lifecycle models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TLA_VERSION: v1.7.4
      TLA_JAR_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tla2tools.jar (version + checksum pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tla"
          jar="$RUNNER_TEMP/tla/tla2tools.jar"
          curl -fsSL --retry 3 -o "$jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_JAR_SHA256}  ${jar}" | sha256sum -c -
          echo "TLA_JAR=$jar" >> "$GITHUB_ENV"
          echo "JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"

      - name: Self-tests (verdict parser, coverage parser, spec discovery, frame lint)
        working-directory: src-tauri/formal
        run: python3 tlc_expect.py --self-test

      - name: Frame lint (every module)
        working-directory: src-tauri/formal
        run: |
          set -euo pipefail
          specs=$(ls -1 *.tla | sed 's/\.tla$//')
          # shellcheck disable=SC2086
          python3 tla_frame_lint.py $specs

      - name: TLC against each config's EXPECT line, with action coverage
        run: |
          set -euo pipefail
          python3 src-tauri/formal/tlc_expect.py --all --markdown | tee "$RUNNER_TEMP/tlc.md"
          {
            echo "## TLC expectations"
            echo
            cat "$RUNNER_TEMP/tlc.md"
          } >> "$GITHUB_STEP_SUMMARY"
