# created: 2026-10-05T18:30:00Z · updated: 2026-10-05 (owner decisions: O-18, O-19, O-20 accepted; red-team pass accepted) · branch: docs/scl-planset · author: Larry Klosowski + Claude Opus 5.5 · status: planset (Stage-2, red-teamed) · red_teamed: 2026-10-05 (see 08_RED_TEAM.md)
# planset: 2026-10-05-sidecar-lifecycle · code: SCL · repo: citrate-core (+ citrate-agent-runtime) · companions: 00_OVERVIEW.md, 05_SPRINTS_AND_WPS.md
# (YAML files carry Rule-12 frontmatter as a comment header so the file stays valid YAML.)
# Rule: a criterion flips to met: true only with an evidence path AND a note saying what the
# evidence shows and what it does not. Native claims stay false until the named native run is recorded.
#
# Owner decision (2026-10-05, O-20 accepted, D-2 amended): the gates are split into a
# CUT-BLOCKING subset and 0.5.x follow-up. Every exit criterion carries `blocks_cut: true|false`.
#   blocks_cut: true  -> must be met before the v0.5.0 cut (the HUP g5-scl line points at these).
#   blocks_cut: false -> still owned and still gated under this planset, finished on the 0.5.x line;
#                        it does not hold the 0.5.0 cut.
# Why a per-criterion tag and not two gate groups: the existing gates are thematic (theory, pre-cut,
# bugs, ownership, containment, proof) and the cut-blocking work cuts across every one of them.
# Two parallel gate groups would duplicate or renumber criteria that other files already cite. Where
# one Stage-2 criterion mixed cut and follow-up work, it is split: the original id keeps the full
# (follow-up) scope with blocks_cut: false, and a new `-cut` id carries the cut slice. No id is
# renumbered or removed. The cut-blocking vs 0.5.x table is in 00_OVERVIEW and 05.
version: 1
program: SCL
release_coupling:
  release: v0.5.0
  rule: >-
    Owner decision (2026-10-05, O-20, D-2 amended): the v0.5.0 cut requires every SCL exit criterion
    marked blocks_cut: true to be met. Criteria marked blocks_cut: false finish on the 0.5.x line under
    this planset and do not hold the cut. Superseded text (kept for the record): "The v0.5.0 cut
    requires every SCL gate below to be met (owner decision 2026-10-05, D-2)."
  hup_gate_line: ".agentile/planset/2026-09-30-hermes-upskill/gates.yaml (gate5, g5-scl)"
  not_gated: The 40204 reroll proceeds independently of SCL.
