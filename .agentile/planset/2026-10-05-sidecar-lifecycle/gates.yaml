        note: Proposed 2026-10-05. Flips when the owner accepts it and the contributor's ADR-0001 and SPEC-001 are on the release line (forward merge from main). Owner decisions O-18, O-19, O-20 and the red-team pass were accepted 2026-10-05; that does not by itself accept the ADR.
