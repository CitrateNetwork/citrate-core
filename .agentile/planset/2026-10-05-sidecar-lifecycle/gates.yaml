        note: D-1..D-14 locked by the owner 2026-10-05. Owner decision (2026-10-05) - D-2 amended (O-20 accepted), D-15 (O-18 accepted), D-16 (O-19 accepted), D-17 (red-team pass accepted) locked. O-1..O-17 remain recommended defaults pending owner sign-off, so this stays false.
