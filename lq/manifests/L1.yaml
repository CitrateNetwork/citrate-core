# L1-WP01: the characterization manifest for lane L1 (Agent Runtime), planset v060, L1 section 2.3.
# Each CH id pins one behavior at citrate-core a826e441 before an L1 work package changes it. A
# later L1 PR that changes a pinned behavior names the CH id it supersedes, in a separate commit
# that says why (assertion-edit rule). LQ-WP12 folds these suites into
# .agentile/coverage/characterization.json.
#
# Runners: every Rust suite below is selected by `cargo test -p citrate-core lq_ch`; every vitest
# suite by `npx vitest run src/lq/core`.
version: 1
lane: L1
pinned_at: a826e441
suites:
  - id: CH-1
    pins: "provider selection: sidecar up gives the sidecar provider, down gives the tool-less fallback with its reason, loop off reads nothing, cloud choice never under local only"
    runner: vitest
    file: src/lq/core/providerSelection.characterize.test.ts
    keeps_green: [src/shell/hermesLiveness.store.test.ts, src/shell/chatProviderKind.test.ts, src/shell/sidecarLoopDefault.test.ts]
  - id: CH-2
    pins: "launch order in start(): syncHermesTerminal, then rebuildProvider, then followHermes; a second start() does nothing"
    runner: vitest
    file: src/lq/core/launchOrder.characterize.test.ts
  - id: CH-3
    pins: "startRuntime idempotence; core's already-running refusal is success; other errors reported once; polls until running; never-up ends off"
    runner: vitest
    file: src/lq/core/startRuntime.characterize.test.ts
    keeps_green: [src/agent/sidecarProvider.lifecycle.test.ts]
  - id: CH-4
    pins: "tool schema ceiling 8 and the ranking on a fixed request corpus"
    runner: vitest
    file: src/lq/core/toolSelection.characterize.test.ts
    keeps_green: [src/agent/harness.retire.test.ts]
    runtime_half: "citrate-agent-runtime agent-loop offered_tools (L1 section 2.3, lq/runtime/offered_tools_characterize.rs): lands in that repo"
  - id: CH-5
    pins: "sidecar env: only allowlisted env-source keys cross, no key-shaped value in any of them, no override of the control bind or bearer file, vendor SDK key variables never inherited"
    runner: cargo
    file: src-tauri/src/lq/hermes_spec_env_keyless_tests.rs
    filter: lq_ch5
  - id: CH-6
    pins: "model proxy: only POST /v1/chat/completions is served; every other path is 404 and reaches no vendor; origin and Host guards run first"
    runner: cargo
    file: src-tauri/src/lq/proxy_paths_characterize_tests.rs
    filter: lq_ch6
    keeps_green: [src-tauri/src/model_proxy_http_tests.rs]
  - id: CH-7
    pins: "custom endpoints refuse IP literals, local names and trailing dots"
    runner: cargo
    file: src-tauri/src/provider_egress_tests.rs
    filter: provider_egress
    note: "kept as is (no new file); WP11 must not edit these tests"
  - id: CH-8
    pins: "node MCP for Hermes is read-only: a read-only token is offered exactly the Read tools and refused every Signature, Action and Budgeted tool before anything is proposed or queued"
    runner: cargo
    file: src-tauri/src/lq/node_mcp_scope_characterize_tests.rs
    filter: lq_ch8
    keeps_green: [src-tauri/src/hermes_mcp_tests.rs, src-tauri/src/node_mcp_tests.rs]
  - id: CH-9
    pins: "approval inbox: decided once, owner-only, expires at exactly the ceremony TTL with its ceremony closed once, MAX_PENDING, pending never trimmed"
    runner: cargo
    file: src-tauri/src/lq/approvals_once_ttl_tests.rs
    filter: lq_ch9
  - id: CH-10
    pins: "the headless dispatcher answers only node_status and groups_list, declines everything else and every hic-required call, and never proposes or approves"
    runner: cargo
    file: src-tauri/src/lq/headless_never_approves_tests.rs
    filter: lq_ch10
    keeps_green: [src-tauri/src/hermes_headless_tests.rs]
  - id: CH-11
    pins: "folder grants fail closed: core's data folder and anything inside it is never grantable (resolved path, by component); a corrupted document grants nothing, refuses every change and is never written over"
    runner: cargo
    file: src-tauri/src/lq/grants_fail_closed_tests.rs
    filter: lq_ch11
    keeps_green: [src-tauri/src/agent_grants_tests.rs]
  - id: CH-12
