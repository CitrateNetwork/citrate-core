[package]
name = "citrate-core"
version = "0.2.6"
description = "citrate-core — the federation desktop house (Tauri full-node app). T1."
authors = ["Citrate Network"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary so the lib name doesn't conflict with the bin
# name on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "citrate_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
citrate-core-kit = { path = "../kit" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# W2.1 — in-app remote auto-updates. Fetches a signed release feed (GitHub Releases
# latest.json), verifies the Ed25519 updater signature against the pinned pubkey in
# tauri.conf.json, downloads + applies on restart. @rule8: the private updater key
# lives ONLY in CI secrets, never the repo.
tauri-plugin-updater = "2"
# W2.4 — relaunch the app after an update is staged (updater installs, process
# plugin restarts into the new version).
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
# CORE-A3 — OIDC loopback-PKCE sign-in.
# ureq: light blocking HTTP client (rustls TLS) for /token, /userinfo, JWKS,
#   revoke. Chosen over reqwest (not already in the Tauri tree; pulls tokio +
#   hyper). Blocking is correct here: the flow runs on a spawned thread, not the
#   Tauri async runtime.
ureq = { version = "3", features = ["json"] }
# jsonwebtoken (ES256): id_token signature + claim (nonce/iss/aud/exp) validation
#   against the authority JWKS. Backed by aws-lc-rs (a maintained, FIPS-oriented
#   crypto provider) rather than the rust_crypto umbrella — the latter pulls the
#   `rsa` crate (RUSTSEC-2023-0071, Marvin timing) even though A3 only uses ES256.
#   aws-lc-rs provides ES256 with no `rsa` in the tree, keeping `cargo audit` clean.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
# url: build the /authorize request + parse the single loopback callback line.
url = "2"
# sha2 + base64: PKCE S256 (challenge = base64url(sha256(verifier))) and JWK
#   coordinate decoding.
sha2 = "0.10"
base64 = "0.22"
# BC-5.3 — sha3 (Keccak-256) for the SBT sub→tokenId lookup: the member subHash is
#   keccak256(sub) (dynamic per-member, so it CANNOT be a pinned selector like the
#   rest of this lean tree). sha3 0.10 is ALREADY compiled into the tree as a normal
#   dependency of citrate-wallet-core (Keccak-256 address derivation), so naming it
#   here adds NO new compiled crate and NO new audit surface — it just makes the
#   already-present hasher directly nameable. (The selector drift tests use the same
#   crate via dev-deps; this promotes it to a runtime dep for the one dynamic hash.)
sha3 = "0.10"
# CORE-B1 — the wallet keystore crypto library (Option A / D-B1.1-1). Used ONLY
#   for BIP39 create/import + BIP44 secp256k1 HD derivation (m/44'/60'/0'/0/i) +
#   UnifiedKey signing/address derivation. We do NOT use its KeyManager /
#   keys.json / session — the A2 custody vault (custody.rs) is the SOLE custody
#   store; the sealed BIP39 entropy lives only there. Git dep pinned to the
#   independently-reviewed B1.1.0 commit (citrate-chain 55f284b); Rule 12 [[drift]]
#   entry landed first in citrate-federation/manifest.toml.
#   NOTE on features: `default-features = false` does NOT build at rev 55f284b —
#   `types.rs::default_keystore_path` references `dirs::` UNCONDITIONALLY while the
#   `dirs` dep is `native`-feature-gated, so the crate only compiles with the
#   default `native` feature on. We keep the default feature (do NOT patch upstream:
#   that would break the reviewed pin). Cost: the `native` feature pulls tokio /
#   reqwest / bincode / dirs / primitive-types / citrate-consensus / citrate-execution
#   into the tree even though Option A uses ONLY the stateless crypto path
#   (secp256k1_from_mnemonic + UnifiedKey). Flagged for the reviewer as a follow-up
#   (a `crypto`-only feature upstream would trim this). The transitive
#   `citrate-security = { path = "../core/security" }` resolves inside the
#   citrate-chain git checkout (the sibling crate is present at that rev).
bip39 = { version = "1.2", features = ["std", "zeroize"] }
# B1.1-F-1: lean crypto-only wallet-core (default-features=false) keeps the zk/execution
# stack (citrate-execution -> ark-groth16 -> tracing-subscriber / RUSTSEC-2025-0055) OUT of
# the key path. B1.4: re-pinned 3dce61c -> 47a6f92 (the B1.4.0 lean EIP-155 tx-signing
# commit + its canonical-RLP r/s trim fix, #69 follow-ups) so the ceremony can sign a real
# 40204 legacy tx via `sign_eip155_legacy_tx`. Still lean: features= ["crypto"], no
# reqwest/tokio/citrate-consensus. Rule 12 [[drift]] landed first in citrate-federation.
citrate-wallet-core = { git = "https://github.com/CitrateNetwork/citrate-chain.git", rev = "47a6f92", default-features = false, features = ["crypto"] }
# CX-S2.2 — the canonical CommD/dataCommit the IPFSIncentivesV3 model bond registers. Pinned at
# citrate-chain 763d764 (the #170 sound-CommD fix + the 40204 redeploy, PR #179). Lean by design:
# ark-bn254 + Poseidon only (NO groth16/nova/tracing-subscriber — verified via `cargo tree`), and
# it is NOT on the key path (it hashes; it never signs), so wallet-core stays at its reviewed
# 47a6f92 (Cargo carries both revs as separate git sources). Byte-exactness is pinned by a
# storage_tests vector check against citrate-commd's frozen `commd_frozen_v1.rs`. Rule 12 [[drift]].
citrate-commd = { git = "https://github.com/CitrateNetwork/citrate-chain.git", rev = "763d764" }
# W1.1 — proposer identity. The node's block-signing (proposer) key is a deterministic
# ed25519 key seeded from Sha3_256(domain ‖ coinbase32); the app must derive the SAME
# public value to read validatorInfo(pubkey) and drive registration. We reimplement the
# ~6-line derivation in validator.rs (leaner than pulling all of citrate-consensus) and
# pin it byte-for-byte with a golden-vector drift tripwire against
# citrate-chain core/consensus/src/crypto.rs::derive_block_signing_key.
ed25519-dalek = "2"
# hex: encode the (non-secret) public key for display in WalletInfo.
hex = "0.4"
# CX-S3.2b — validate/mint the device-sealed comms member key (Option A): a scoped secp256k1
# secret sealed in the OS keyring. k256 checks a minted/loaded 32-byte value is a real secp256k1
# scalar before it is handed to the member-daemon (whose EthWallet::from_secret_key would reject
# 0 / >= n). ALREADY in the tree transitively (citrate-wallet-core → bip32 → k256, and the kit),
# so naming it direct adds NO new compiled crate. Was a dev-dep (ecrecover test); promoted here.
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }

# CORE-C1.0 — SidecarSupervisor process-signalling. `libc` is used ONLY for the
# Unix `kill(pid, SIGTERM|SIGKILL|0)` on the graceful-stop / liveness path
# (std::process has no SIGTERM, only a hard kill). It is ALREADY in the tree
# transitively (tauri/tokio), so naming it as a direct dep adds NO new compiled
# crate and NO new audit surface (RUSTSEC clean at 0.2.x). Unix-only: on Windows
# (out of beta scope, O-4) the supervisor falls back to std `Child::kill`, so no
# libc there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test-only mock OIDC authority: p256 signs the id_token with a TEST key and
#   serves its public coords as JWKS, so the full flow is exercised headlessly.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
# k256 (ecrecover round-trip proof, CORE-B1.1) moved to [dependencies] for CX-S3.2b (comms-key
# validation); still test-reachable there. sha3 likewise lives in [dependencies] (BC-5.3 SBT subHash).
# CORE-B1.4 test-only: reconstruct the EIP-155 signing-hash RLP payload in the
# ceremony tx-broadcast test to ecrecover the broadcast signature back to the
# wallet address. Same `rlp` 0.5 the wallet-core lean crypto path uses.
rlp = "0.5"
