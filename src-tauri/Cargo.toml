[package]
name = "citrate-core"
version = "0.1.0"
description = "citrate-core — the federation desktop house (Tauri full-node app). T1."
authors = ["Citrate Network"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary so the lib name doesn't conflict with the bin
# name on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "citrate_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
