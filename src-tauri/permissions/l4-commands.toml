# L0-WP03 (planset v060, L0_INTEGRATION_SEAMS 3.1): the app commands of lane L4, conversations.
#
# Only L4 edits this file. It lists exactly the commands `src/commands/l4.rs` registers
# (`seams_tests` fails when the two differ), and only `capabilities/default.json` (the main
# window) holds it. Pop-out windows (`capabilities/popout.json`) get no app command at all.
# Split from the HUP-S5.4 main-window.toml; the ten lane permissions together allow exactly the
# commands that one did.

[[permission]]
identifier = "l4-commands"
description = "Lane L4 app commands, for the main window only (pop-outs get none)."
commands.allow = [
  "groups_create",
  "comms_relay_status",
  "groups_list",
  "groups_self_address",
  "groups_join",
  "groups_add_member",
  "groups_roster",
  "groups_assign_role",
  "groups_offboard",
  "groups_send",
  "groups_messages",
]
