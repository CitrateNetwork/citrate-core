# HUP-S5.4 — the app's own commands, allowed for the MAIN window only.
#
# Tauri allows every app command to every local window until the app defines its own ACL. This
# file defines it: the permission below lists every command registered in lib.rs
# (`generate_handler!`), and only `capabilities/default.json` (the main window) holds it. Pop-out
# windows (`capabilities/popout.json`) get the bridge events and no app command at all.
#
# The main window keeps exactly the commands it had. `popout_tests.rs` fails if a command is
# registered in lib.rs but missing here (the main window could not call it), or listed here but
# not registered. Add a new command in both places.

[[permission]]
identifier = "main-window-commands"
description = "Every app command, for the main window only (pop-outs get none)."
