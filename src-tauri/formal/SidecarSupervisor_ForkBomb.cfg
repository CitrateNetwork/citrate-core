\* Fork-bomb config: CRASH-LOOP-ONLY child (CanHealthy = FALSE), never stopped.
\* Pins INV-2 (the fork-bomb bound): the consecutive counter stays bounded AND
\* the run actually REACHES Failed within MaxRetries (liveness). Run:
\*   java -cp <tla2tools.jar> tlc2.TLC -config SidecarSupervisor_ForkBomb.cfg SidecarSupervisor.tla
CONSTANTS
    MaxRetries = 3
    MaxCrashes = 8
    CanHealthy = FALSE

SPECIFICATION ForkBombSpec

INVARIANT TypeOK
INVARIANT INV_CounterBounded
INVARIANT INV_NoOrphan

PROPERTY EventuallyFailedIfNeverHealthy
