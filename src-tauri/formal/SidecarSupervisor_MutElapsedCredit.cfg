\* EXPECT: violated INV_CreditOnlyFromAttestedHealth
\* Mutant (defect (b)): a tick at age >= healthy_after grants retry credit for a
\* Probed service with no attested success (the elapsed rule). Base:
\* SidecarSupervisor_ProbedForkBomb.cfg. Witness: SidecarSupervisor_ReachUnattestedTick.cfg.
\* The constraint is needed here: the reset makes the crash loop unbounded.
CONSTANTS
    MaxRetries = 2
    MaxCrashes = 3
    MaxInc = 4
    MaxIntents = 3
    MaxGen = 1
    CanHealthy = FALSE
    Profile = "Probed"
    HealthyAfterTicks = 2
    GraceTicks = 3
    FreshTicks = 2
    MaxAge = 4
    Mutant = "ElapsedCredit"

SPECIFICATION ForkBombSpec

CONSTRAINT Bounds

INVARIANT TypeOK
INVARIANT INV_CreditOnlyFromAttestedHealth
