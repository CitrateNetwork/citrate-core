\* WebSigningBudget with owner decision O-3 ACCEPTED (same-origin content does not taint a
\* sign-in to that origin). Taint can come from either origin or "ext". Checks that the
\* exemption never reaches x402 and never covers content from another origin.
CONSTANTS
    Origins = {o1, o2}
    Allowlist = {o1}
    Recipients = {r1}
    Nonces = {n1, n2}
    Values = {1, 2, 3}
    OtherKinds = {"Tx", "Permit"}
    MaxCount = 2
    PerSigMax = 2
    PerRecipMax = 3
    GlobalMax = 4
    SiweWindowMax = 2
    SiweMinGap = 1
    W = 3
    TTL = 3
    MaxClock = 4
    MaxReq = 2
    MaxGrants = 2
    MaxCrashes = 1
    O3Exempt = TRUE
    ReqKinds = {"Siwe", "X402"}
    TaintSources = {o1, o2, "ext"}

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OnlyClosedList
INVARIANT OriginBound
INVARIANT TopFrameOnly
INVARIANT NonceUnique
INVARIANT NoCapabilityDelegation
INVARIANT RecipientPinned
INVARIANT NeverExceedsCaps
INVARIANT ReservedBeforeSigned
INVARIANT RevokeImmediate
INVARIANT ExpiredInert
INVARIANT TaintDowngrade
INVARIANT RecordBeforeSignature
INVARIANT NoFalseNegative
INVARIANT NoDrop

PROPERTY BudgetMonotone
