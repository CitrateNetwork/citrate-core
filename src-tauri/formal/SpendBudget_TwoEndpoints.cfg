\* HUP-S1.5 — SpendBudget with two endpoints (removal voids only that endpoint's quotes), two
\* escalations, one day boundary.
CONSTANTS
    Endpoints = {e1, e2}
    QIds = {q1, q2}
    Costs = {1, 2}
    Caps = {0, 2}
    MaxDay = 1
    NoPrice = NoPrice
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SpendWithinCap
INVARIANT NoEscalationWithoutShownPrice
INVARIANT EgressOptInOnly
INVARIANT OverBudgetOrTaintedNeedsHic1
INVARIANT ReservedIsConsistent
PROPERTY ResetOnlyAtPeriodBoundary
PROPERTY PeriodMonotone
