\* HUP-S1.5 — SpendBudget safety: one endpoint, three escalations, two prices, caps 0/2/3, a clock
\* over days 0..2 that can also move backwards.
CONSTANTS
    Endpoints = {e1}
    QIds = {q1, q2, q3}
    Costs = {1, 2}
    Caps = {0, 2, 3}
    MaxDay = 2
    NoPrice = NoPrice
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SpendWithinCap
INVARIANT NoEscalationWithoutShownPrice
INVARIANT EgressOptInOnly
INVARIANT OverBudgetOrTaintedNeedsHic1
INVARIANT ReservedIsConsistent
PROPERTY ResetOnlyAtPeriodBoundary
PROPERTY PeriodMonotone
