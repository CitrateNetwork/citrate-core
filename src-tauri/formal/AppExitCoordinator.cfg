\* EXPECT: pass
\* Green config: three owners plus Hermes, every trigger, a small deadline
\* (3 ticks) with the Hermes sub-deadline at 1. Checks every safety invariant,
\* the action properties X-6 and X-9, and the liveness properties X-11 and L-1.
\* Run: scripts/run-tlc.sh AppExitCoordinator
CONSTANTS
    Owners = {o1, o2, o3}
    Hermes = h
    DeadlineTicks = 3
    HermesSubTicks = 1
    MaxTickets = 1
    MaxRetry = 1
    Mutant = "none"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT X1_EveryExitPathRoutes
INVARIANT X2_NoFinalBeforeComplete
INVARIANT X3_ClosingRejectsAdmission
INVARIANT X4_AdmittedTicketsDrained
INVARIANT X5_ExpiredNeverAuthorizes
INVARIANT X7_HermesChildrenScope
INVARIANT X8_ForceExitNeverComplete
INVARIANT X10_UnpreventableExitDrains
INVARIANT X11_CompleteIsHonest
INVARIANT X12_QuitActuatesHeldScopes

PROPERTY X6_NoRecursiveDrain
PROPERTY X9_HermesDrainsFirst
PROPERTY X11_QuitAlwaysTerminates
PROPERTY L1_CloseTerminates
