\* EXPECT: pass
\* Slow retry ON, fork-bomb spec (never-healthy, never stopped, weak fairness). The run
\* reaches Failed, and every slow retry ends back in Failed. INV-17 amended 2026-11-04 (owner decision, core#600 CORE-D3).
CONSTANTS
    MaxRetries = 3
    MaxCrashes = 5
    MaxInc = 6
    MaxIntents = 3
    MaxGen = 1
    CanHealthy = FALSE
    Profile = "LivenessOnly"
    HealthyAfterTicks = 1
    GraceTicks = 0
    FreshTicks = 1
    MaxAge = 2
    Mutant = "none"
    SlowRetry = TRUE
    MaxSlowRetries = 2
    SpawnFlaky = FALSE

SPECIFICATION ForkBombSpec

INVARIANT TypeOK
INVARIANT INV_CounterBounded
INVARIANT INV_StopIsNotACrash
INVARIANT INV_NoOrphan
INVARIANT INV_StopNeverSpawns
INVARIANT INV_CreditOnlyFromAttestedHealth
INVARIANT INV_GraceNeverCredits
INVARIANT INV_LivenessOnlyResetUnchanged
INVARIANT INV_ProbePermitBounded
INVARIANT INV_TimeoutNeverFreesPermit
INVARIANT INV_ReadyIsCurrent
INVARIANT INV_QuarantineHoldsNoChild
INVARIANT INV_StoppedOwnsNothing
INVARIANT INV_CrashBoundBetweenMemberStarts
INVARIANT INV_SlowRetryOneAttempt

PROPERTY INV_RepeatedStopJoins
PROPERTY StopNeverCounts
PROPERTY INV_StaleCompletionInert
PROPERTY INV_ReplaceAfterCleanup
PROPERTY INV_QuarantineNotRecycled
PROPERTY INV_SlowRetryOnlyFromFailed
PROPERTY EventuallyFailedIfNeverHealthy
PROPERTY SlowRetryReturnsToFailed
