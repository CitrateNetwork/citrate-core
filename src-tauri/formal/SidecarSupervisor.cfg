\* EXPECT: pass
\* Primary config: RECOVERING child, LivenessOnly profile (no configured probe).
\* Pins INV-1 (never permanently Failed while it recovers) on today's elapsed
\* rule (INV-9), plus every safety invariant, under Stop, Start and replacement
\* intents. Run: scripts/run-tlc.sh SidecarSupervisor
CONSTANTS
    MaxRetries = 3
    MaxCrashes = 4
    MaxInc = 5
    MaxIntents = 3
    MaxGen = 1
    CanHealthy = TRUE
    Profile = "LivenessOnly"
    HealthyAfterTicks = 1
    GraceTicks = 0
    FreshTicks = 1
    MaxAge = 2
    Mutant = "none"

SPECIFICATION Spec

CONSTRAINT Bounds

INVARIANT TypeOK
INVARIANT INV_NeverFailedWhenRecovering
INVARIANT INV_CounterBounded
INVARIANT INV_StopIsNotACrash
INVARIANT INV_NoOrphan
INVARIANT INV_StopNeverSpawns
INVARIANT INV_LivenessOnlyResetUnchanged
INVARIANT INV_ProbePermitBounded
INVARIANT INV_TimeoutNeverFreesPermit
INVARIANT INV_ReadyIsCurrent
INVARIANT INV_QuarantineHoldsNoChild

PROPERTY INV_RepeatedStopJoins
PROPERTY StopNeverCounts
PROPERTY INV_StaleCompletionInert
PROPERTY INV_ReplaceAfterCleanup
PROPERTY INV_QuarantineNotRecycled
