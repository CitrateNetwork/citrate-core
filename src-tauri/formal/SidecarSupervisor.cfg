\* Primary config: RECOVERING child (CanHealthy = TRUE).
\* Pins INV-1 (never permanently Failed while it can recover) plus the safety
\* invariants that hold in all configs. Run:
\*   java -cp <tla2tools.jar> tlc2.TLC -config SidecarSupervisor.cfg SidecarSupervisor.tla
CONSTANTS
    MaxRetries = 3
    MaxCrashes = 8
    CanHealthy = TRUE

SPECIFICATION Spec

CONSTRAINT CrashesBounded

INVARIANT TypeOK
INVARIANT INV_NeverFailedWhenRecovering
INVARIANT INV_CounterBounded
INVARIANT INV_StopIsNotACrash
INVARIANT INV_NoOrphan
