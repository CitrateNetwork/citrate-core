\* WebSigningBudget, SIWE focus (B-1): only SIWE requests, 3 of them, across an allowlisted
\* and a non-allowlisted origin, 3 provenances, domain/URI binding, Resources, 3 nonces.
\* Three nonces let a third sign-in to one origin happen (revoke, re-grant) inside one
\* window, so the per-origin rolling rate (SiweWindowMax) binds; with 2 it never could.
\* No x402 recipients. Strict taint rule.
CONSTANTS
    Origins = {o1, o2}
    Allowlist = {o1}
    Recipients = {}
    Nonces = {n1, n2, n3}
    Values = {1, 2, 3}
    OtherKinds = {"Tx", "Permit"}
    MaxCount = 2
    PerSigMax = 2
    PerRecipMax = 3
    GlobalMax = 4
    SiweWindowMax = 2
    SiweMinGap = 1
    W = 3
    TTL = 3
    MaxClock = 4
    MaxReq = 3
    MaxGrants = 2
    MaxCrashes = 1
    O3Exempt = FALSE
    ReqKinds = {"Siwe"}
    TaintSources = {"ext"}

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OnlyClosedList
INVARIANT OriginBound
INVARIANT TopFrameOnly
INVARIANT NonceUnique
INVARIANT NoCapabilityDelegation
INVARIANT RecipientPinned
INVARIANT NeverExceedsCaps
INVARIANT ReservedBeforeSigned
INVARIANT RevokeImmediate
INVARIANT ExpiredInert
INVARIANT TaintDowngrade
INVARIANT RecordBeforeSignature
INVARIANT NoFalseNegative
INVARIANT NoDrop

PROPERTY BudgetMonotone
