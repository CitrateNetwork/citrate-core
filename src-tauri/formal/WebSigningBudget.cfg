\* TLC config for WebSigningBudget (HUP-S2.3 formal half; ADR-2026-09-30 Rule-3 D9).
\* Small bounds from the ADR: 2 origins, 2 recipients, 1 asset, max_count = 2,
\* window = 3 ticks, 2 nonces, 1 crash. Strict taint rule (O-3 not accepted).
CONSTANTS
    Origins = {o1, o2}
    Allowlist = {o1}
    Recipients = {r1, r2}
    Nonces = {n1, n2}
    Values = {1, 2, 3}
    OtherKinds = {"Tx", "Permit"}
    MaxCount = 2
    PerSigMax = 2
    PerRecipMax = 3
    GlobalMax = 4
    SiweWindowMax = 2
    SiweMinGap = 1
    W = 3
    TTL = 3
    MaxClock = 4
    MaxReq = 2
    MaxGrants = 2
    MaxCrashes = 1
    O3Exempt = FALSE
    ReqKinds = {"Siwe", "X402", "Tx", "Permit"}
    TaintSources = {"ext"}

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OnlyClosedList
INVARIANT OriginBound
INVARIANT TopFrameOnly
INVARIANT NonceUnique
INVARIANT NoCapabilityDelegation
INVARIANT RecipientPinned
INVARIANT NeverExceedsCaps
INVARIANT ReservedBeforeSigned
INVARIANT RevokeImmediate
INVARIANT ExpiredInert
INVARIANT TaintDowngrade
INVARIANT RecordBeforeSignature
INVARIANT NoFalseNegative
INVARIANT NoDrop

PROPERTY BudgetMonotone
