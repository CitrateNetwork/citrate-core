\* WebSigningBudget liveness: FallThroughLive (a request is never stuck, the lock is always
\* released, a crash is always recovered) under weak fairness of Decide/Sign/Return/Recover.
\* No SYMMETRY (unsound with liveness in TLC), so bounds are smaller.
CONSTANTS
    Origins = {o1, o2}
    Allowlist = {o1}
    Recipients = {r1}
    Nonces = {n1}
    Values = {1, 3}
    OtherKinds = {"Tx", "Permit"}
    MaxCount = 2
    PerSigMax = 2
    PerRecipMax = 3
    GlobalMax = 4
    SiweWindowMax = 2
    SiweMinGap = 1
    W = 3
    TTL = 3
    MaxClock = 4
    MaxReq = 2
    MaxGrants = 2
    MaxCrashes = 1
    O3Exempt = FALSE
    ReqKinds = {"Siwe", "X402", "Tx", "Permit"}
    TaintSources = {"ext"}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT OnlyClosedList
INVARIANT OriginBound
INVARIANT TopFrameOnly
INVARIANT NonceUnique
INVARIANT NoCapabilityDelegation
INVARIANT RecipientPinned
INVARIANT NeverExceedsCaps
INVARIANT ReservedBeforeSigned
INVARIANT RevokeImmediate
INVARIANT ExpiredInert
INVARIANT TaintDowngrade
INVARIANT RecordBeforeSignature
INVARIANT NoFalseNegative
INVARIANT NoDrop

PROPERTY BudgetMonotone
PROPERTY FallThroughLive
