\* EXPECT: pass
\* WebSigningBudget, every request class at once at tiny bounds: SIWE, x402, a generic Tx
\* intent and a B-3 call. Shows the four classes share one lock and one closed list, and
\* covers the B-1/B-2 actions the B-3 config never takes (tlc_expect action coverage).
\* Liveness (FallThroughLive) for every class, so no SYMMETRY; one grant keeps it small
\* (regrants are covered by the B-3 config and the pre-B-3 configs).
CONSTANTS
    Origins = {o1}
    Allowlist = {o1}
    Recipients = {r1}
    Nonces = {n1}
    Values = {1}
    OtherKinds = {"Tx"}
    MaxCount = 1
    PerSigMax = 1
    PerRecipMax = 1
    GlobalMax = 1
    SiweWindowMax = 1
    SiweMinGap = 1
    W = 3
    TTL = 3
    MaxClock = 3
    MaxReq = 2
    MaxGrants = 1
    MaxCrashes = 1
    O3Exempt = FALSE
    ReqKinds = {"Siwe", "X402", "Tx", "BudgetedCall"}
    TaintSources = {"ext"}
    Sessions = {"s1"}
    Contracts = {"k1"}
    Chains = {"c40204"}
    CallValues = {0}
    Gas = {1}
    Selectors = {"plain"}
    CallMaxOps = 1
    CallTTL = 3
    GasCap = 1
    MaxDeploys = 1
    B3Mutant = "none"

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT OnlyClosedList
INVARIANT NeverExceedsCaps
INVARIANT ReservedBeforeSigned
INVARIANT RevokeImmediate
INVARIANT ExpiredInert
INVARIANT TaintDowngrade
INVARIANT RecordBeforeSignature
INVARIANT NoFalseNegative
INVARIANT NoDrop
INVARIANT NoCreationAutoSigned
INVARIANT NoValueAutoSigned
INVARIANT OnlyOwnDeployedTargets
INVARIANT ChainPinned
INVARIANT NoRawAckAutoSigned
INVARIANT NoDelegationAutoSigned
INVARIANT SessionBound
INVARIANT GasCapped
INVARIANT OriginBound
INVARIANT TopFrameOnly
INVARIANT NonceUnique
INVARIANT NoCapabilityDelegation
INVARIANT RecipientPinned

PROPERTY BudgetMonotone
PROPERTY FallThroughLive
