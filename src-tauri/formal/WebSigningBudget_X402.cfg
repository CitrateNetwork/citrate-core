\* WebSigningBudget, x402 focus (B-2 cap model): only x402 requests, 4 of them, so the
\* per-signature, per-recipient rolling, global rolling and max_count caps all bind and
\* the window slides across the bounded clock. One origin (unused), one crash.
CONSTANTS
    Origins = {o1}
    Allowlist = {o1}
    Recipients = {r1, r2}
    Nonces = {n1}
    Values = {1, 2, 3}
    OtherKinds = {"Tx", "Permit"}
    MaxCount = 2
    PerSigMax = 2
    PerRecipMax = 3
    GlobalMax = 4
    SiweWindowMax = 2
    SiweMinGap = 1
    W = 3
    TTL = 3
    MaxClock = 4
    MaxReq = 4
    MaxGrants = 2
    MaxCrashes = 1
    O3Exempt = FALSE
    ReqKinds = {"X402"}
    TaintSources = {"ext"}

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OnlyClosedList
INVARIANT OriginBound
INVARIANT TopFrameOnly
INVARIANT NonceUnique
INVARIANT NoCapabilityDelegation
INVARIANT RecipientPinned
INVARIANT NeverExceedsCaps
INVARIANT ReservedBeforeSigned
INVARIANT RevokeImmediate
INVARIANT ExpiredInert
