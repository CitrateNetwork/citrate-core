\* Hermes ModelRouter model check (P0 / WP0.1). One local model, one registry model,
\* one gateway — small but enough to exercise select-not-ready → fallback → become-ready.
\* Run: java -cp <tla2tools.jar> tlc2.TLC -config ModelRouter.cfg ModelRouter.tla
CONSTANTS
    LocalModels = {loc1}
    RegistryModels = {reg1}
    Gateway = gw

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT INV_SingleActive
INVARIANT INV_ReadyToServe
INVARIANT INV_NoPhantom

PROPERTY LIVE_ReadyEventually
