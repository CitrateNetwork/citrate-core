# citrate-core-kit — the shared safety-critical spine (extracted from src-tauri).
#
# Single-sources the SignatureCeremony (the one HITL signing path), the OS-keyring
# custody vault, the OIDC loopback-PKCE RP, the sidecar supervisor, the gated
# wallet signer, the JSON-RPC client, tx decoding, and app config — so
# citrate-core AND citrate-quorum depend on ONE implementation, never a fork.
#
# The gated signer (`wallet::sign_message`/`sign_transaction`, `pub(crate)`) is
# now crate-private to THIS crate, reachable only from `ceremony::approve` — the
# extraction strengthens the property it must preserve.
[package]
name = "citrate-core-kit"
version = "0.1.0"
description = "citrate-core-kit — shared ceremony / custody / oidc / supervisor / wallet / rpc spine. T1."
authors = ["Citrate Network"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
ureq = { version = "3", features = ["json"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
url = "2"
sha2 = "0.10"
# HKDF-SHA256 for wallet::derive_scoped_secret (CONNECT-S5 portable comms identity): a scoped,
# deterministic secret from the sealed entropy, NOT a signature. Already compiled transitively
# (hkdf/hmac are in Cargo.lock) — promoting to a direct dep adds no new compiled crate.
hkdf = "0.12"
base64 = "0.22"
sha3 = "0.10"
bip39 = { version = "1.2", features = ["std", "zeroize"] }
# Same pinned rev + lean crypto-only feature set as citrate-core used; cargo
# dedupes the git dep across the two workspace members.
citrate-wallet-core = { git = "https://github.com/CitrateNetwork/citrate-chain.git", rev = "47a6f92", default-features = false, features = ["crypto"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
# supervisor.rs: POSIX process signals (SIGTERM→grace→SIGKILL, no orphan).
libc = "0.2"
# ceremony.rs: RLP for legacy-tx decoding in the human-readable intent.
rlp = "0.5"
