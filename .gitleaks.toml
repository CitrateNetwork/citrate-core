# gitleaks config for the merge-gate secret-scan (merge-gate.yml picks this file up).
# The default rules apply. Exceptions are test fixtures whose values are provably not credentials.
[extend]
useDefault = true

[[allowlists]]
description = "GROW-S2 §13 public rendezvous test vectors (see the file's provenance field)"
paths = ['''^kit/src/fixtures/rendezvous-v1\.json$''']

[[allowlists]]
description = "0.5.1 upgrade fixtures: test-only vault keys, invite tokens and their hashes, minted for the fixture by the v0.5.1 code (fixtures/upgrade-v0.5.1/GENERATOR.md); none is used on the network"
paths = ['''^fixtures/upgrade-v0\.5\.1/''']

[[allowlists]]
description = "The canonical citrate-chain address book kept byte for byte next to the embedded book (scripts/sync-addresses.py; the release profile check recomputes its sha256). Public contract addresses only; names such as ModelAccessControl next to a 40-hex address match the generic-api-key rule"
paths = ['''^src-tauri/addresses/40204\.canonical\.json$''', '''^fixtures/network-cut/pre-cut/src-tauri/addresses/40204\.canonical\.json$''']

[[allowlists]]
description = "#681 deploy-claim check cases, shared byte for byte with citrate-agent-runtime (both pin its sha256). Public 40204 contract addresses and model answers only; a label such as Token next to a 40-hex address matches the generic-api-key rule"
paths = ['''^src/agent/fixtures/deploy_claims_cases\.json$''']

[[allowlists]]
description = "L0-WP02 characterization snapshots: AppState's netKey is the r1007 genesis hash (currentNetKey in netScope.ts), a public value that matches the generic-api-key rule next to the word key. The entry pins that literal hash and nothing else, so it applies in any file but only to a line whose netKey is exactly the public r1007 genesis; the same line with any other 64-hex value (for example a private key) is still flagged. It is regex-only because gitleaks 8.30 with condition AND plus a path allows the whole path."
regexTarget = "line"
regexes = ['''^\s*"netKey": "0xcf68634502b4fca1e977ac8dd35aa006bb40c04208d5cd55f1c2b508bba96631",?$''']
