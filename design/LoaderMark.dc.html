<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:24,&quot;max&quot;:420,&quot;step&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8ecc09&quot;,&quot;options&quot;:[&quot;#8ecc09&quot;,&quot;#ffbd10&quot;,&quot;#0e0f0c&quot;,&quot;#e9efe7&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:2.1,&quot;min&quot;:0.3,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;cycle&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:9000,&quot;min&quot;:5000,&quot;max&quot;:20000,&quot;step&quot;:500,&quot;tsType&quot;:&quot;number&quot;},&quot;turns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:6,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;ringRadius&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:33,&quot;min&quot;:18,&quot;max&quot;:46,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;arcSweep&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:26,&quot;min&quot;:12,&quot;max&quot;:60,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;thickness&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:12,&quot;min&quot;:4,&quot;max&quot;:18,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  // Embeddable Citrate loader — the C-mark explodes into a spinning ring
  // of liquid arcs and reassembles. Identical physics to the canonical
  // Citrate Loader template, packaged to fill its container so it can sit
  // in chat thinking states, stage verifications, and node ignition.
  // Honors prefers-reduced-motion: renders the static mark, no loop.
  renderVals() {
    return {
      size: this.props.size ?? 120,
      setSvg: (el) => { this.svg = el; },
    };
  }

  componentDidMount() {
    this.Cx = 61.63; this.Cy = 52.14; this.N = 140;
    this.last = performance.now();
    this.arcKey = '';
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!this.reduced) this.start();
    else this.paint(); // static mark, tinted
  }

  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); }

  paint() {
    const tint = () => {
      if (!this.svg) { requestAnimationFrame(tint); return; }
      const color = this.props.color ?? '#8ecc09';
      for (const p of this.svg.querySelectorAll('.pc')) p.setAttribute('fill', color);
    };
    tint();
  }

  signedArea(pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      s += a.x * b.y - b.x * a.y;
    }
    return s / 2;
  }

  resample(pts, N) {
    const seg = []; let total = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      seg.push(d); total += d;
    }
    const out = []; const step = total / N; let i = 0, acc = 0;
    for (let j = 0; j < N; j++) {
      const dist = j * step;
      while (i < seg.length - 1 && acc + seg[i] < dist) { acc += seg[i]; i++; }
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const f = seg[i] ? (dist - acc) / seg[i] : 0;
      out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
    }
    return out;
  }

  buildArc(R, sweepDeg, tMax, N) {
    const sweep = sweepDeg * Math.PI / 180;
    const M = 160; const dense = [];
    const thick = (s) => tMax * Math.pow(s, 0.62);
    for (let k = 0; k <= M; k++) {
      const s = k / M; const ang = -sweep / 2 + sweep * s;
      const ro = R + thick(s) / 2;
      dense.push({ x: ro * Math.cos(ang), y: ro * Math.sin(ang) });
    }
    const ang1 = sweep / 2;
    const rad = { x: Math.cos(ang1), y: Math.sin(ang1) };
    const tan = { x: -Math.sin(ang1), y: Math.cos(ang1) };
    const Cc = { x: R * Math.cos(ang1), y: R * Math.sin(ang1) };
    const cr = tMax / 2; const CAP = 22;
    for (let k = 1; k < CAP; k++) {
      const phi = Math.PI * k / CAP;
      dense.push({
        x: Cc.x + cr * (Math.cos(phi) * rad.x + Math.sin(phi) * tan.x),
        y: Cc.y + cr * (Math.cos(phi) * rad.y + Math.sin(phi) * tan.y),
      });
    }
    for (let k = M; k >= 0; k--) {
      const s = k / M; const ang = -sweep / 2 + sweep * s;
      const ri = R - thick(s) / 2;
      dense.push({ x: ri * Math.cos(ang), y: ri * Math.sin(ang) });
    }
    const res = this.resample(dense, N);
    this.arcSign = this.signedArea(res);
    return res.map(pt => ({ rad: Math.hypot(pt.x, pt.y), ang: Math.atan2(pt.y, pt.x) }));
  }

  start() {
    if (!this.svg) { this.raf = requestAnimationFrame(() => this.start()); return; }
    const paths = Array.from(this.svg.querySelectorAll('.pc'));
    if (!paths.length || !paths[0].getTotalLength) { this.raf = requestAnimationFrame(() => this.start()); return; }
    const color = this.props.color ?? '#8ecc09';
    for (const p of paths) p.setAttribute('fill', color);
    const N = this.N;
    this.buildArc(30, 30, 11, N);
    const targetSign = this.arcSign;
    this.pieces = paths.map((path) => {
      const L = path.getTotalLength();
      let src = [];
      for (let j = 0; j < N; j++) {
        const pt = path.getPointAtLength(L * j / N);
        src.push({ x: pt.x, y: pt.y });
      }
      if (Math.sign(this.signedArea(src)) !== Math.sign(targetSign)) src.reverse();
      return { path, src };
    });
    let gx = 0, gy = 0, gc = 0;
    for (const pc of this.pieces) for (const p of pc.src) { gx += p.x; gy += p.y; gc++; }
    this.Cx = gx / gc; this.Cy = gy / gc;
    for (const pc of this.pieces) {
      let sx = 0, sy = 0;
      for (const p of pc.src) { sx += p.x; sy += p.y; }
      pc.cx = sx / pc.src.length; pc.cy = sy / pc.src.length;
      pc.rad = Math.hypot(pc.cx - this.Cx, pc.cy - this.Cy);
      pc.ang = Math.atan2(pc.cy - this.Cy, pc.cx - this.Cx) * 180 / Math.PI;
      pc.cw = (((pc.ang + 90) % 360) + 360) % 360;
    }
    const byAngle = [...this.pieces].sort((a, b) => a.cw - b.cw);
    const center = this.pieces.reduce((m, pc) => pc.rad < m.rad ? pc : m, this.pieces[0]);
    const peel = byAngle.filter(pc => pc !== center).concat([center]);
    const n = peel.length, step = 360 / n;
    peel.forEach((pc, m) => { pc.order = m; pc.slot = -90 + m * step; });
    for (const pc of this.pieces) {
      pc.srcPolar = pc.src.map(p => ({
        r: Math.hypot(p.x - this.Cx, p.y - this.Cy),
        a: Math.atan2(p.y - this.Cy, p.x - this.Cx),
      }));
    }
    this.loop();
  }

  alignOffsets() {
    if (!this.pieces || !this.arc) return;
    const N = this.N, D = Math.PI / 180, arc = this.arc, Cx = this.Cx, Cy = this.Cy;
    for (const pc of this.pieces) {
      const base = pc.slot * D;
      const tx = new Float64Array(N), ty = new Float64Array(N);
      for (let i = 0; i < N; i++) { const a = base + arc[i].ang; tx[i] = Cx + arc[i].rad * Math.cos(a); ty[i] = Cy + arc[i].rad * Math.sin(a); }
      let best = 0, bestErr = Infinity;
      for (let o = 0; o < N; o++) {
        let err = 0;
        for (let k = 0; k < N; k += 4) {
          const s = pc.src[k], j = (k + o) % N;
          const dx = s.x - tx[j], dy = s.y - ty[j];
          err += dx * dx + dy * dy;
          if (err >= bestErr) break;
        }
        if (err < bestErr) { bestErr = err; best = o; }
      }
      pc.offset = best;
    }
  }

  ease(p) { p = Math.max(0, Math.min(1, p)); return p * p * p * (p * (p * 6 - 15) + 10); }

  loop() {
    const now = performance.now();
    this.last = now;
    const speed = this.props.speed ?? 2.1;
    const R = this.props.ringRadius ?? 33;
    const sweep = this.props.arcSweep ?? 26;
    const tMax = this.props.thickness ?? 12;
    const key = `${R}|${sweep}|${tMax}`;
    if (key !== this.arcKey) { this.arc = this.buildArc(R, sweep, tMax, this.N); this.arcKey = key; this.alignOffsets(); }
    const T = (this.props.cycle ?? 9000) / speed;
    const phase = (now % T) / T;
    const turns = this.props.turns ?? 1;
    const hold = this.props.hold ?? 0.008;
    const n = this.pieces.length;
    const ramp = this.props.ramp ?? 0.09;
    const span = Math.max(0.05, (1 - 2 * hold) / 2);
    const downStart = hold;
    const upStart = downStart + span + hold;
    const spin = 360 * turns * phase;
    const arc = this.arc, N = this.N, Cx = this.Cx, Cy = this.Cy, D = Math.PI / 180;
    for (const pc of this.pieces) {
      const m = pc.order;
      const outAt = downStart + (m / n) * (span - ramp);
      const inAt = upStart + (m / n) * (span - ramp);
      let ep;
      if (phase < outAt) ep = 0;
      else if (phase < outAt + ramp) ep = this.ease((phase - outAt) / ramp);
      else if (phase < inAt) ep = 1;
      else if (phase < inAt + ramp) ep = this.ease(1 - (phase - inAt) / ramp);
      else ep = 0;
      const midAng = (pc.slot + spin) * D;
      const off = pc.offset || 0;
      let d = 'M';
      for (let k = 0; k < N; k++) {
        const ai = (k + off) % N;
        const rr = arc[ai].rad, ar = midAng + arc[ai].ang;
        const hp = pc.srcPolar[k];
        const r = hp.r + (rr - hp.r) * ep;
        let dA = ar - hp.a; dA = Math.atan2(Math.sin(dA), Math.cos(dA));
        const a = hp.a + dA * ep;
        const x = Cx + r * Math.cos(a);
        const y = Cy + r * Math.sin(a);
        d += (k ? 'L' : '') + x.toFixed(2) + ' ' + y.toFixed(2);
      }
      d += 'Z';
      pc.path.setAttribute('d', d);
    }
    this.raf = requestAnimationFrame(() => this.loop());
  }
}
