# cargo-about configuration for the third-party notices of the Rust sidecars and the app
# (scripts/third-party-notices.mjs, HUP gate g3-licence). Order is preference: for a crate offered
# under several licences, cargo-about picks the first accepted one, so the shortest permissive text
# ships. BUSL-1.1 is accepted only so first-party crates (Citrate's own, filtered out of the
# notices by source) do not stop the scan; scripts/third-party-notices.mjs refuses any third-party
# crate whose chosen licence is outside its permissive list, so policy lives in one place.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "Unlicense",
  "MPL-2.0",
  "BUSL-1.1",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
